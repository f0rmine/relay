version: 2

updates:
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "[deps]"
    groups:
      mobile-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Native plugins must match the Capacitor 6 major until a planned
      # Capacitor 7 migration (newer majors break `npm ci`).
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capawesome/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@aparajita/capacitor-secure-storage"
        update-types: ["version-update:semver-major"]
      # Ionic 9 requires Capacitor 7+; upgrade together with that migration.
      - dependency-name: "@ionic/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ionicons"
        update-types: ["version-update:semver-major"]
      # Keep Node typings on the runtime major used by CI and local dev (24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "[deps]"
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Ruff is pinned deliberately; new rules are adopted in their own change.
      - dependency-name: ruff

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "[deps]"
    groups:
      github-actions:
        patterns: ["*"]
